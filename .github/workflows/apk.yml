# Baut die Android-App (APK) und legt sie unter Releases ab.
# Der Plan selbst kommt live von GitHub Pages (plan.json) – bei Planänderungen ist KEIN neuer Build nötig.
name: Android-App bauen
on:
  push:
    branches: [main]
    paths: ["www/index.html", "capacitor.config.json", "package.json", "assets/**", "signing/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Fester Signatur-Schlüssel (damit Updates sich drüberinstallieren lassen)
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      - run: npx cap add android
      - name: App-Icon erzeugen
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#d9480f' --splashBackgroundColor '#11161c'
        continue-on-error: true
      - run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Stefans-Dienste.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Dienstplan – Android-App
          body: "Installieren: Stefans-Dienste.apk auf dem Handy öffnen. Der Dienstplan aktualisiert sich danach von selbst."
          make_latest: true
          files: Stefans-Dienste.apk
