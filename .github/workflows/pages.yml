# Kopiert www/ bei jeder Änderung in den Branch gh-pages.
# GitHub Pages veröffentlicht gh-pages dann automatisch (Web-App + plan.json für die Android-App).
name: Web-App veröffentlichen
on:
  push:
    branches: [main]
    paths: ["www/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: www nach gh-pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git subtree split --prefix www -b gh-pages-neu
          git push --force origin gh-pages-neu:gh-pages
